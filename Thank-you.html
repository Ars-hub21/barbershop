<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>БАРБЕРШОП — Запись создана!</title>

  <script src="js/core/site-config.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&family=Syncopate:wght@700&family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="thankyou">
  
  <header class="header">
    <div class="header-content">
      <h1 class="address">
        <i class="fas fa-map-marker-alt"></i>
        <span class="address-text">Урус-Мартан, ул. им. Шейха Солса-Хаджи Яндарова, 147</span>
      </h1>
      <a href="map.html" class="map-link" target="_blank">
        <i class="fas fa-compass"></i> На карте
      </a>
    </div>
  </header>

  <main class="container success-page">
    <!-- Анимированный маркер триумфа (стилизуется через CSS) -->
    <div class="success-icon">
      <i class="fas fa-check"></i>
    </div>
    
    <h2 class="step-title">Запись успешно создана!</h2>
    
    <!-- Уникальный номер электронного билета-квитанции -->
    <p class="order-number" id="orderNumber"></p>
    
    <!-- Детализация бронирования (Мастер, дата, время, чек услуг) -->
    <div class="order-details" id="orderDetails"></div>
    
    <!-- Возврат в начало для новой записи -->
    <button class="btn btn-primary" id="resetAndGoHome">
      <i class="fas fa-home" style="margin-right: 0.5rem; font-size: 0.85rem;"></i> На главную
    </button>
  </main>

  <!-- Инфраструктура JavaScript скриптов -->
  <script src="js/core/config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/global-cache.js"></script>
  <script src="js/data/masters.js"></script>
  <script src="js/data/services.js"></script>
  <script src="js/utils/time.js"></script>
  <script src="js/pages/thank-you-page.js"></script>
  <script src="js/core/init.js"></script>

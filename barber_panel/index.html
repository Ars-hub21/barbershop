<!-- barber_panel/index.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Панель барберов — вход</title>
  <!-- ЕДИНАЯ ТОЧКА ТЕМЫ САЙТА — та же тема, что и на клиентском сайте,
       чтобы панель барберов всегда была визуально в тон (data-theme
       выставляется ДО отрисовки, поэтому подключаем первым скриптом) -->
  <script src="../js/core/site-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Syncopate:wght@700&family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="css/barber_styles.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-icon"><i class="fas fa-cut"></i></div>
      <h1>Панель барберов</h1>
      <p class="login-subtitle">Введите пароль для доступа</p>
      <form id="loginForm">
        <div class="form-group">
          <input type="password" id="passwordInput" placeholder="Введите пароль" />
        </div>
        <button type="submit" class="btn btn-primary btn-large">Войти</button>
        <p class="login-error" id="loginError"></p>
      </form>
    </div>
  </div>
  
  <script src="js/barber_script.js"></script>
</body>
</html>

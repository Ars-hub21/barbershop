<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Отзывы — панель</title>
  <script src="../js/core/site-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&family=Syncopate:wght@700&family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="css/barber_styles.css" />
</head>
<body>
  <header class="dashboard-header">
    <div class="container">
      <div class="header-content">
        <h1 class="dashboard-title"><i class="fas fa-star" style="color:var(--star-active);"></i> Отзывы</h1>
        <a href="dashboard.html" class="btn btn-secondary btn-sm">← Назад</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="reviews-filter">
      <div class="form-group">
        <label>Фильтр по мастеру:</label>
        <select id="filterMaster">
          <option value="all">Все</option>
        </select>
      </div>
    </div>

    <div class="reviews-stats" id="reviewsStats"></div>
    <div id="reviewsList" class="reviews-list"></div>
  </main>

  <audio id="notificationSound" preload="auto">
    <source src="sounds/notification.mp3" type="audio/mpeg">
  </audio>
  <!-- ТОЛЬКО ПОДКЛЮЧЕНИЯ СКРИПТОВ -->
  <script src="../js/data/masters.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/barber-reviews.js"></script>
</body>
</html>

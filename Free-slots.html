<!-- ==========================================================================
 frontend/client/Free-slots.html # Шаг 2 — Выбор даты и времени записи
 ========================================================================== -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>БАРБЕРШОП — Выбор времени</title>

  <script src="js/core/site-config.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&family=Syncopate:wght@700&family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="slots">
  
  <header class="header">
    <div class="header-content">
      <h1 class="address">
        <i class="fas fa-map-marker-alt"></i>
        <span class="address-text">Урус-Мартан, ул. им. Шейха Солса-Хаджи Яндарова, 147</span>
      </h1>
      <a href="map.html" class="map-link" target="_blank">
        <i class="fas fa-compass"></i> На карте
      </a>
    </div>
  </header>

  <main class="container">
    <!-- Информация об автоматическом или выбранном мастере -->
    <div id="selectedMasterInfo" class="selected-master-info"></div>

    <h2 class="step-title">Выберите дату и время</h2>

    <!-- Календарный блок интерактивной сетки -->
    <div class="calendar-wrapper">
      <div class="calendar-header">
        <button id="prevMonthBtn"><i class="fas fa-chevron-left"></i></button>
        <span id="calendarMonthYear"></span>
        <button id="nextMonthBtn"><i class="fas fa-chevron-right"></i></button>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>

    <!-- Главная панель вывода временных слотов -->
    <div id="slotsContainer" class="slots-container">
      <!-- ===== ИНДИКАТОР ЗАГРУЗКИ (Спиннер управляется через CSS) ===== -->
      <div id="slotsLoading" class="slots-loading">
        <div class="spinner"></div>
        <p>Запрашиваем свободное время у мастера...</p>
      </div>
      
      <!-- ===== ПЛЕЙСХОЛДЕР СТАРТОВОГО СОСТОЯНИЯ ===== -->
      <div id="slotsPlaceholder" class="slots-placeholder" style="display:none;">
        Выберите день, чтобы увидеть доступное время
      </div>
    </div>

    <!-- Сообщение-заглушка, если все слоты заняты -->
    <div id="noSlotsMessage" class="no-slots-message" style="display:none;">
      <p>В этот день нет свободного времени.</p>
      <button id="goToNearestBtn" class="btn btn-primary btn-sm">Перейти к ближайшей дате</button>
    </div>

    <!-- Навигационная панель переходов -->
    <div class="navigation-buttons">
      <a href="Services.html" class="btn btn-secondary">
        <i class="fas fa-chevron-left" style="margin-right: 0.5rem; font-size: 0.75rem;"></i> Назад
      </a>
      <button class="btn btn-primary" id="toContactsBtn">
        Далее <i class="fas fa-chevron-right" style="margin-left: 0.5rem; font-size: 0.75rem;"></i>
      </button>
    </div>
  </main>

  <!-- Инфраструктура JavaScript скриптов -->
  <script src="js/core/config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/global-cache.js"></script>
  <script src="js/data/masters.js"></script>
  <script src="js/data/services.js"></script>
  <script src="js/utils/time.js"></script>
  <script src="js/pages/slots-page.js"></script>
  <script src="js/core/init.js"></script>
</body>
</html>

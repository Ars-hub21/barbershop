<!-- ==========================================================================
 frontend/client/index.html — Главная страница онлайн-записи барбершопа
 ========================================================================== -->

<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>БАРБЕРШОП — Онлайн-бронирование</title>

  <!-- ЕДИНАЯ ТОЧКА НАСТРОЙКИ ТЕМЫ И БРЕНДА (обязательно ДО css/theme.css,
       чтобы data-theme проставился до отрисовки страницы) -->
  <script src="js/core/site-config.js"></script>

  <!-- Шрифты обеих версий сайта: Montserrat/Syncopate (мужская) и
       Nunito/Cormorant Garamond (женская). Какая пара реально используется —
       решает css/theme.css через переменные --font-body/--font-display. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Syncopate:wght@700&family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />

  <!-- FontAwesome для иконок -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Тема (цвета/шрифты мужской и женской версии) — правьте её для ребрендинга -->
  <link rel="stylesheet" href="css/theme.css" />
  <!-- Структура и компоненты сайта -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body data-page="home">

  <!-- Хедер с гео-позицией салона -->
  <header class="header">
    <div class="header-content">
      <h1 class="address">
        <i class="fas fa-map-marker-alt"></i>
        <span class="address-text">Урус-Мартан, ул. им. Шейха Солса-Хаджи Яндарова, 147</span>
      </h1>
      <a href="map.html" class="map-link" target="_blank">
        <i class="fas fa-compass"></i> На карте
      </a>
    </div>
  </header>

  <!-- Короткий слоган бренда (текст берётся из BRAND.tagline в site-config.js) -->
  <p class="brand-tagline" hidden></p>

  <!-- Основной контент виджета -->
  <main class="container">
    <h2 class="step-title">Выберите мастера</h2>

    <div class="masters-grid">
      <!-- ========== КАРТОЧКА ДЕНИ ========== -->
      <div class="master-card" data-id="1">
        <div class="master-photo">
          <img src="img/Deni.png" alt="Дени" />
        </div>
        <div class="master-card-info">
          <div class="master-name">Дени</div>
          <div class="master-title">Топ-Барбер</div>
          <div class="master-rating" id="ratingDeni"></div>
          <div class="master-slots" id="slotsDeni"></div>
        </div>
      </div>

      <!-- ========== КАРТОЧКА БАУДИ ========== -->
      <div class="master-card" data-id="2">
        <div class="master-photo">
          <img src="img/Baudi.png" alt="Бауди" />
        </div>
        <div class="master-card-info">
          <div class="master-name">Бауди</div>
          <div class="master-title">Топ-Барбер</div>
          <div class="master-rating" id="ratingBaudi"></div>
          <div class="master-slots" id="slotsBaudi"></div>
        </div>
      </div>
    </div>

    <!-- Переключатель "Любой специалист" -->
    <div class="any-master-toggle">
      <label class="toggle-label">
        <input type="checkbox" id="anyMasterCheck" />
        <span class="toggle-text">Любой специалист</span>
      </label>
      <span class="toggle-note">(система автоматически подберёт свободного барбера)</span>
    </div>

    <!-- Кнопки управления шагами -->
    <div class="navigation-buttons">
      <button class="btn btn-primary btn-large" id="toStep3Btn">
        Выбрать услуги <i class="fas fa-chevron-right" style="margin-left: 0.5rem; font-size: 0.75rem;"></i>
      </button>
    </div>

    <!-- Модуль отзывов клиентов -->
    <div class="reviews-link-wrapper">
      <a href="reviews.html" class="btn btn-accent btn-sm">
        <i class="fas fa-star" style="margin-right: 0.3rem;"></i> Читать отзывы
      </a>
    </div>

    <!-- ==========================================================================
         ГАЛЕРЕЯ РАБОТ «ДО / ПОСЛЕ» — второстепенный блок, свёрнут по умолчанию.
         Раскрывается по клику. Данные карточек — js/data/gallery.js,
         логика — js/pages/gallery-widget.js.
         ========================================================================== -->
    <section class="gallery-widget" id="galleryWidget">
      <button class="gallery-toggle" id="galleryToggle" aria-expanded="false" aria-controls="galleryPanel">
        <i class="fas fa-images"></i>
        <span>Галерея работ</span>
        <i class="fas fa-chevron-down gallery-toggle-icon"></i>
      </button>
      <div class="gallery-panel" id="galleryPanel">
        <div class="gallery-panel-inner">
          <div class="gallery-grid" id="galleryGrid"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- Инфраструктура JavaScript скриптов -->
  <script src="js/core/config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/global-cache.js"></script>
  <script src="js/data/masters.js"></script>
  <script src="js/data/services.js"></script>
  <script src="js/data/gallery.js"></script>
  <script src="js/utils/time.js"></script>
  <script src="js/utils/scissors-loader.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/gallery-widget.js"></script>
  <script src="js/core/init.js"></script>
</body>

</html>

 ========================================================================== -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>БАРБЕРШОП — Подтверждение записи</title>

  <script src="js/core/site-config.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Syncopate:wght@700&family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="contacts">
  
  <header class="header">
    <div class="header-content">
      <h1 class="address">
        <i class="fas fa-map-marker-alt"></i>
        <span class="address-text">Урус-Мартан, ул. им. Шейха Солса-Хаджи Яндарова, 147</span>
      </h1>
      <a href="map.html" class="map-link" target="_blank">
        <i class="fas fa-compass"></i> На карте
      </a>
    </div>
  </header>

  <main class="container">
    <h2 class="step-title">Подтверждение записи</h2>

    <!-- Блок итоговой сводки деталей (заполняется через JS) -->
    <div class="order-summary" id="orderSummary"></div>

    <!-- Анкета контактных данных -->
    <form id="clientForm" class="client-form">
      <div class="form-group">
        <label for="clientName">Ваше имя <span class="required">*</span></label>
        <input type="text" id="clientName" placeholder="Введите ваше имя" required />
      </div>
      <div class="form-group">
        <label for="clientPhone">Номер телефона <span class="required">*</span></label>
        <input type="tel" id="clientPhone" placeholder="+7 (___) ___-__-__" required />
      </div>
      <div class="form-group">
        <label for="clientEmail">E-mail (опционально)</label>
        <input type="email" id="clientEmail" placeholder="example@mail.com" />
      </div>
      <div class="form-group">
        <label for="clientComment">Комментарий к записи</label>
        <textarea id="clientComment" rows="2" placeholder="Особые пожелания или важные детали..."></textarea>
      </div>

      <!-- Чекбоксы согласий и правовых документов -->
      <div class="consents">
        <label class="checkbox-label">
          <input type="checkbox" id="consentPersonal" checked required />
          <span>Я даю согласие на обработку персональных данных.</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="consentMailing" />
          <span>Я согласен на получение информационно-рекламной рассылки.</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="consentMessenger" checked />
          <span>Я согласен получать сообщения и уведомления в мессенджере.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-large" id="submitOrderBtn">
        Завершить запись <i class="fas fa-check" style="margin-left: 0.5rem; font-size: 0.85rem;"></i>
      </button>
    </form>

    <!-- Возврат на шаг назад -->
    <div class="navigation-buttons">
      <a href="Free-slots.html" class="btn btn-secondary">
        <i class="fas fa-chevron-left" style="margin-right: 0.5rem; font-size: 0.75rem;"></i> Назад
      </a>
    </div>
  </main>

  <!-- Инфраструктура JavaScript скриптов -->
  <script src="js/core/config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/data/masters.js"></script>
  <script src="js/data/services.js"></script>
  <script src="js/utils/time.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/scissors-loader.js"></script>
  <script src="js/pages/contacts-page.js"></script>
  <script src="js/core/init.js"></script>
</body>
</html>

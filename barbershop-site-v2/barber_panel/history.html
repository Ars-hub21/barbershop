<!-- barber_panel/history.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>История</title>
  <script src="../js/core/site-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Syncopate:wght@700&family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../css/theme.css" />
  <link rel="stylesheet" href="css/barber_styles.css" />
</head>
<body>
  <header class="dashboard-header">
    <div class="container">
      <div class="header-content">
        <h1 class="dashboard-title">
          <i class="fas fa-history"></i> История
          <span id="historyMasterName" style="font-size:1.2rem;color:var(--accent);"></span>
        </h1>
        <a href="dashboard.html" class="btn btn-secondary btn-sm">← Назад</a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="history-controls">
      <div class="form-group">
        <label>Выберите месяц:</label>
        <input type="month" id="historyMonth" />
      </div>
    </div>

    <div class="history-stats">
      <div class="stat-card">
        <span class="stat-label">Обслужено клиентов</span>
        <span class="stat-value" id="historyCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Общая сумма</span>
        <span class="stat-value" id="historyTotal">0 ₽</span>
      </div>
    </div>

    <div id="historyList" class="history-list"></div>
  </main>

  <!-- ТОЛЬКО ПОДКЛЮЧЕНИЯ СКРИПТОВ -->
  <script src="../js/data/masters.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/barber-history.js"></script>
</body>
</html>

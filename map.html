<!-- frontend\client\map.html Яндекс карты для построения маршрута -->
<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>БАРБЕРШОП — Карта и маршрут</title>

  <script src="js/core/site-config.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&family=Syncopate:wght@700&family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .map-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .map-container iframe {
      width: 100%;
      height: 500px;
      border: none;
    }

    .back-link {
      display: inline-block;
      margin-top: 1.5rem;
    }

    .map-info {
      color: var(--text-secondary);
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .route-btn {
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .map-container iframe {
        height: 350px;
      }
    }

    @media (max-width: 480px) {
      .map-container iframe {
        height: 280px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="header-content">
        <h1 class="address">
          <i class="fas fa-map-pin"></i>
          <span class="address-text">Урус-Мартан, ул. им. Шейха Солса-Хаджи Яндарова, 147</span>
        </h1>
      </div>
    </div>
  </header>

  <main class="container">
    <h2 class="step-title">Как нас найти</h2>
    <p class="map-info">
      <i class="fas fa-location-dot" style="color:var(--accent);"></i>
      <span class="address-text">Урус-Мартан, улица имени Шейха Солса-Хаджи Яндарова, 147</span>
    </p>

    <!-- Кнопка для построения маршрута -->
    <div class="route-btn">
      <a href="https://yandex.ru/maps/?rtext=~43.123456,45.123456&rtt=auto&ruri=ymapsbm1://geo?ll=45.123456,43.123456&spn=0.01,0.01&text=Урус-Мартан, улица имени Шейха Солса-Хаджи Яндарова, 147"
        target="_blank" class="btn btn-primary">
        <i class="fas fa-route"></i> Проложить маршрут
      </a>
      <span style="color:var(--text-secondary);font-size:0.85rem;margin-left:0.8rem;">
        (откроется в новой вкладке)
      </span>
    </div>

    <div class="map-container">
      <!-- Яндекс.Карты с меткой -->
      <iframe src="https://yandex.ru/map-widget/v1/?um=constructor%3A1a2b3c4d5e6f7g8h9i0j&source=constructor"
        allowfullscreen>
      </iframe>
    </div>

    <a href="index.html" class="btn btn-secondary back-link">
      <i class="fas fa-arrow-left"></i> Назад
    </a>
  </main>
</body>

</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#201e23"/>
  <defs>
    <linearGradient id="glow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9a5b0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d9a5b0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="60" r="180" fill="url(#glow2)"/>

  <!-- Силуэт: кисть руки с аккуратным маникюром (плейсхолдер "ПОСЛЕ") -->
  <g fill="#e7c9a9" stroke="#c9a686" stroke-width="1.5">
    <!-- ладонь -->
    <rect x="158" y="150" width="94" height="88" rx="32"/>
    <!-- большой палец -->
    <rect x="118" y="150" width="34" height="70" rx="16" transform="rotate(-28 135 185)"/>
    <!-- пальцы -->
    <rect x="167" y="92" width="20" height="80" rx="10"/>
    <rect x="192" y="72" width="20" height="100" rx="10"/>
    <rect x="217" y="82" width="20" height="90" rx="10"/>
    <rect x="242" y="100" width="20" height="72" rx="10"/>
  </g>

  <!-- аккуратный маникюр: розовое покрытие с лёгким бликом -->
  <g fill="#d9a5b0" stroke="#f0c9cf" stroke-width="1">
    <ellipse cx="177" cy="98" rx="8" ry="9"/>
    <ellipse cx="202" cy="78" rx="8" ry="9"/>
    <ellipse cx="227" cy="88" rx="8" ry="9"/>
    <ellipse cx="252" cy="106" rx="7.5" ry="8.5"/>
  </g>
  <g fill="#f6dde2" opacity="0.7">
    <ellipse cx="174" cy="95" rx="2.4" ry="3"/>
    <ellipse cx="199" cy="75" rx="2.4" ry="3"/>
    <ellipse cx="224" cy="85" rx="2.4" ry="3"/>
    <ellipse cx="249" cy="103" rx="2.2" ry="2.8"/>
  </g>

  <text x="200" y="272" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a89099" letter-spacing="1">
    ПЛЕЙСХОЛДЕР — ЗАМЕНИТЕ НА РЕАЛЬНОЕ ФОТО
  </text>
</svg>

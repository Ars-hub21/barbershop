<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#201e23"/>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c5a059" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="200" cy="60" r="180" fill="url(#glow)"/>

  <!-- Силуэт: голова + аккуратно уложенные волосы (плейсхолдер "ПОСЛЕ") -->
  <g transform="translate(200,150)">
    <circle cx="0" cy="30" r="70" fill="#1c191c"/>
    <path d="M -62 -6
             C -66 -46 -38 -78 0 -80
             C 38 -78 66 -46 62 -6
             C 62 -18 50 -30 38 -26
             C 34 -40 18 -50 0 -50
             C -18 -50 -34 -40 -38 -26
             C -50 -30 -62 -18 -62 -6 Z"
          fill="#b89568" stroke="#d9b87e" stroke-width="1.5"/>
    <circle cx="0" cy="40" r="46" fill="#e7c9a9"/>
  </g>

  <text x="200" y="280" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#a89a78" letter-spacing="1">
    ПЛЕЙСХОЛДЕР — ЗАМЕНИТЕ НА РЕАЛЬНОЕ ФОТО
  </text>
</svg>

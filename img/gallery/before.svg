             C 46 -50 64 -58 70 -40
             C 58 -32 74 -22 66 -6
             C 78 2 62 14 68 26
             C 50 20 60 40 44 36
             C 40 52 24 34 16 48
             C 6 36 -6 54 -18 40
             C -30 52 -34 30 -48 34

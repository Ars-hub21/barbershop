<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>БАРБЕРШОП — Выбор услуг</title>

  <script src="js/core/site-config.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&family=Syncopate:wght@700&family=Nunito:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="services">
  
  <header class="header">
    <div class="header-content">
      <h1 class="address">
        <i class="fas fa-map-marker-alt"></i>
        <span class="address-text">Урус-Мартан, ул. им. Шейха Солса-Хаджи Яндарова, 147</span>
      </h1>
      <a href="map.html" class="map-link" target="_blank">
        <i class="fas fa-compass"></i> На карте
      </a>
    </div>
  </header>

  <main class="container">
    <h2 class="step-title">Выберите услуги</h2>

    <!-- Категории меню услуг барбершопа -->
    <div class="tabs">
      <button class="tab-btn active" data-category="all">Все услуги</button>
      <button class="tab-btn" data-category="main">Основные</button>
      <button class="tab-btn" data-category="extra">Дополнительные</button>
      <button class="tab-btn" data-category="complex">Комплексы</button>
    </div>

    <!-- Контейнер для динамического JS-рендеринга карточек услуг -->
    <div id="servicesContainer" class="services-container"></div>

    <!-- Панель итоговой сводки -->
    <div class="summary-block">
      <p>Итого: <span id="totalPrice">0</span> ₽</p>
      <p>Общее время: <span id="totalDuration">0 мин</span></p>
    </div>

    <!-- Кнопки перемещения по этапам -->
    <div class="navigation-buttons">
      <a href="index.html" class="btn btn-secondary">
        <i class="fas fa-chevron-left" style="margin-right: 0.5rem; font-size: 0.75rem;"></i> Назад
      </a>
      <button class="btn btn-primary" id="toFreeSlotsBtn">
        Далее <i class="fas fa-chevron-right" style="margin-left: 0.5rem; font-size: 0.75rem;"></i>
      </button>
    </div>
  </main>

  <!-- Инфраструктура JavaScript скриптов -->
  <script src="js/core/config.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/global-cache.js"></script>
  <script src="js/data/masters.js"></script>
  <script src="js/data/services.js"></script>
  <script src="js/utils/time.js"></script>
  <script src="js/pages/services-page.js"></script>
  <script src="js/core/init.js"></script>
</body>
</html>
